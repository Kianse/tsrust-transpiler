[package]
name = "tsrust-error-post"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Kianse/tsrust-transpiler"
readme = "../../README.md"
description = "TypeScript-ish syntax to Rust transpiler (prototype)"
keywords = ["rust", "transpiler", "typescript", "compiler"]
categories = ["compilers"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
duct = "0.13"   # run cargo
